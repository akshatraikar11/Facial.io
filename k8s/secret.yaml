apiVersion: v1
kind: Secret
metadata:
  name: facialio-secrets
  namespace: facialio
type: Opaque

# ── IMPORTANT: This file is a TEMPLATE only ───────────────────────────────────
# Never commit real values here. This file is committed with placeholder
# strings. Real values are injected via:
#   1. kubectl create secret (manual)
#   2. A secrets manager (AWS Secrets Manager, Vault, Doppler)
#   3. Sealed Secrets (encrypted secrets safe to commit)
#
# To create the secret with real values:
#   kubectl create secret generic facialio-secrets \
#     --from-literal=MONGODB_URI="mongodb+srv://..." \
#     --from-literal=CLERK_SECRET_KEY="sk_live_..." \
#     --namespace=facialio
#
# Values must be base64-encoded when specified directly in YAML:
#   echo -n "your_value" | base64
# ─────────────────────────────────────────────────────────────────────────────
stringData:
  # stringData accepts plain strings — kubectl base64-encodes them automatically
  MONGODB_URI: "REPLACE_WITH_MONGODB_ATLAS_URI"
  CLERK_SECRET_KEY: "REPLACE_WITH_CLERK_SECRET_KEY"
  CLERK_WEBHOOK_SECRET: "REPLACE_WITH_CLERK_WEBHOOK_SECRET"
  PINECONE_API_KEY: "REPLACE_WITH_PINECONE_API_KEY"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
  STRIPE_SECRET_KEY: "REPLACE_WITH_STRIPE_SECRET_KEY"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"
  STRIPE_PRO_PRICE_ID: "REPLACE_WITH_STRIPE_PRO_PRICE_ID"
  STRIPE_ENTERPRISE_PRICE_ID: "REPLACE_WITH_STRIPE_ENTERPRISE_PRICE_ID"
