apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: facialio
  labels:
    app: mongo
spec:
  replicas: 1       # MongoDB runs as a single pod — use Atlas for HA in production
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: facialio
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db    # MongoDB stores data here
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc    # defined below

---
# PersistentVolumeClaim — requests durable storage from the cluster.
# Without this, data is lost every time the MongoDB pod restarts.
# The cluster provisions an actual disk (cloud provider's block storage).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: facialio
spec:
  accessModes:
    - ReadWriteOnce    # only one pod can mount this at a time — correct for MongoDB
  resources:
    requests:
      storage: 5Gi

---
# ClusterIP Service — exposes MongoDB internally.
# Other pods (NestJS server) connect to 'mongo:27017' inside the cluster.
# MongoDB is NOT exposed externally — no external IP.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: facialio
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP    # internal only — never LoadBalancer for a database

# ── Interview answer ──────────────────────────────────────────────────────────
# "MongoDB runs in a single pod backed by a PersistentVolumeClaim for durable
#  storage. It's exposed only via ClusterIP — never publicly. The NestJS server
#  connects to it at 'mongodb://mongo:27017/facialio' using Kubernetes DNS.
#  In production we'd use MongoDB Atlas instead and remove this deployment
#  entirely — managed database, backups, and replication included."
