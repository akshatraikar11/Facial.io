apiVersion: apps/v1
kind: Deployment
metadata:
  name: facialio-client
  namespace: facialio
  labels:
    app: facialio-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facialio-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: facialio-client
    spec:
      containers:
        - name: facialio-client
          # The frontend is a static build served by nginx.
          # The Dockerfile (root) builds Vite and copies dist/ into nginx.
          image: facialio-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: facialio-client-svc
  namespace: facialio
spec:
  selector:
    app: facialio-client
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP

# ── Why nginx for the frontend? ────────────────────────────────────────────────
# Vite builds the React app into static HTML/JS/CSS files in dist/.
# We copy them into an nginx container — nginx serves them in ~2ms.
# nginx also handles SPA routing: any unknown path returns index.html
# so React Router can handle it client-side. See nginx.conf at repo root.
